dataset:
  split: held_out_pdb
  batch_size: 16

model:
  class_name: DDGPredictor
  params:
    embedding_source_mode: sequence_only
    active_heads: [regression]
    regression_hidden_dims: []
    regression_dropout: 0.0
    pooling_strategy: norm_softmax

loss:
  class_name: DDGRegressionLoss
  params: {}

metrics:
  class_name: BoundedMAE
  params: {}

trainer:
  max_epochs: 15
  learning_rate: 0.001
  experiment_name: sequence_only_linear_normsoftmax
