dataset:
  split: held_out_pdb
  batch_size: 16

model:
  class_name: DDGPredictor
  params:
    embedding_source_mode: structure_and_sequence
    active_heads: [regression]
    regression_hidden_dims: []
    regression_dropout: 0.0
    pooling_strategy: norm_softmax
    normalize_before_fusion: true

loss:
  class_name: DDGRegressionLoss
  params: {}

metrics:
  class_name: BoundedMAE
  params: {}

trainer:
  max_epochs: 7
  learning_rate: 0.001
  experiment_name: structure_saprot_and_sequence_linear_normfusion_7ep
