dataset:
  split: same_pdb_allowed
  batch_size: 16

model:
  class_name: DDGPredictor
  params:
    embedding_source_mode: structure_and_sequence
    active_heads: [regression]
    regression_hidden_dims: []
    regression_dropout: 0.0
    pooling_strategy: norm_softmax_by_chain_role
    pooling_temperature: 5.0

loss:
  class_name: DDGRegressionLoss
  params: {}

metrics:
  class_name: BoundedMAE
  params: {}

trainer:
  max_epochs: 20
  learning_rate: 0.001
  weight_decay: 0.001
  experiment_name: structure_saprot_and_sequence_linear_splitpool_temp5_same_pdb_allowed_wd1e3_20ep
