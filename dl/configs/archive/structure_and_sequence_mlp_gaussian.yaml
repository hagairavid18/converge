dataset:
  split: held_out_pdb
  batch_size: 16

model:
  class_name: DDGPredictor
  params:
    embedding_source_mode: structure_and_sequence
    active_heads: [regression]
    regression_hidden_dims: [64]
    regression_dropout: 0.3
    pooling_strategy: gaussian_distance

loss:
  class_name: DDGRegressionLoss
  params: {}

metrics:
  class_name: BoundedMAE
  params: {}

trainer:
  max_epochs: 15
  learning_rate: 0.001
  experiment_name: structure_and_sequence_mlp_gaussian
